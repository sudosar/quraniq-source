name: Generate Daily Puzzle

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "puzzle-generation"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.check.outputs.generated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate daily puzzle
        id: generate
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_daily_puzzle.py

      - name: Check if puzzle was generated
        id: check
        if: always()
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "data/daily_puzzle.json" ]; then
            GENERATED=$(TODAY="$TODAY" python3 -c "import json,os; d=json.load(open('data/daily_puzzle.json')); print('true' if d.get('generated') and d.get('date')==os.environ['TODAY'] else 'false')")
            echo "generated=$GENERATED" >> $GITHUB_OUTPUT
          else
            echo "generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Puzzle generation failed for ${DATE}" \
            --body "Puzzle generation failed for ${DATE}. Check the workflow run logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for details." \
            --label "bug" 2>/dev/null || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Puzzle generation failed for ${DATE}" \
            --body "Puzzle generation failed for ${DATE}. Check the workflow run logs for details."

      # Commit even on failure: the script saves successful games to
      # data/history/ before failing, and a later run regenerates only the
      # missing games. Output files are only written on full success, so a
      # partial commit can never clobber the live puzzle.
      - name: Commit and push (including partial progress)
        if: always()
        run: |
          git config user.name "QuranPuzzle Bot"
          git config user.email "bot@quranpuzzle.app"
          git add data/
          git diff --staged --quiet || {
            if [ "${{ steps.check.outputs.generated }}" = "true" ]; then
              git commit -m "Generate daily puzzles for $(date -u +%Y-%m-%d)"
            else
              git commit -m "Save partial puzzles for $(date -u +%Y-%m-%d) (some games failed, retry will resume)"
            fi
            git pull --rebase origin main
            git push
          }
